<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streak Photobooth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #c6ff33;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #7d39eb;
    border: 3px solid rgba(255,255,255,0.25);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  h1 {
    color: #111;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  p.tag {
    color: rgba(0,0,0,0.6);
    font-size: 14px;
    margin-bottom: 32px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #111;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 14px;
    padding: 14px 18px;
    text-decoration: none;
    color: #fff;
    transition: background 0.15s, transform 0.1s;
  }
  a.link:active {
    transform: scale(0.98);
    background: #000;
  }
  .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon svg { width: 22px; height: 22px; }
  .wa .icon { background: #25D366; }
  .ig .icon { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
  .fb .icon { background: #1877F2; }
  .em .icon { background: #EA4335; }
  .tt .icon { background: #010101; }
  .call .icon { background: #34C759; }
  .label { font-size: 15px; font-weight: 500; text-align: left; }
  .sub { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 1px; text-align: left; }
</style>
